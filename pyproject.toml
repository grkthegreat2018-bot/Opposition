[project]
name = "oposition"
version = "0.1.0"
description = "3D dream game with Vulkan (wgpu) and CUDA"
requires-python = ">=3.13"
dependencies = [
    "wgpu>=0.31.0",
    "rendercanvas>=2.6.0",
    "PyMCubes>=0.1.6",
    "numpy>=2.0.0",
    "opensimplex>=0.4.0",
    "noise>=1.2.2",
    "glfw>=2.10.0",
    "psutil>=7.2.0",
    "nvidia-ml-py>=12.0.0",
    "cupy-cuda13x>=14.0.0 ; platform_system=='Windows'",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pyright]
pythonVersion = "3.13"
venvPath = "."
venv = ".venv"
